<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Off Limits 4x4</title>

  <style>
    :root {
      --bg-dark: #0f130e;
      --bg-panel: #171d16;
      --text-main: #f2f2ee;
      --text-muted: #b3b3a8;
      --accent-primary: #d9772b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        "Arial Narrow",
        "Bahnschrift",
        "Oswald",
        system-ui,
        sans-serif;
    }

    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      color: var(--text-main);
      background:
        radial-gradient(
          1000px 500px at 50% -200px,
          rgba(217,119,43,0.18),
          transparent 70%
        ),
        #0f130e;
    }

    /* HAMBURGER */
    .menu-btn {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 30;
      width: 34px;
      height: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .menu-btn span {
      height: 3px;
      width: 100%;
      background: var(--text-main);
      border-radius: 2px;
    }

    /* SIDEBAR */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 280px;
      background: var(--bg-panel);
      border-right: 1px solid rgba(217,119,43,0.35);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 25;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4rem 0 1.5rem;
    }

    nav.open {
      transform: translateX(0);
    }

    .nav-inner {
      display: flex;
      flex-direction: column;
      gap: 2.2rem;
      padding-left: 2.5rem;
    }

    nav a {
      text-decoration: none;
      color: var(--text-main);
      font-size: 1rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      transition: color 0.2s ease, transform 0.15s ease;
    }

    nav a:hover {
      color: var(--accent-primary);
      transform: translateX(4px);
    }

    /* SOCIALS */
    .socials {
      border-top: 1px solid rgba(217,119,43,0.25);
      padding: 1.5rem 2.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }

    .socials span {
      color: var(--text-muted);
      font-size: 0.7rem;
      margin-bottom: 0.2rem;
    }

    .socials a {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.75rem;
      transition: color 0.2s ease;
    }

    .socials a:hover {
      color: var(--accent-primary);
    }

    .socials svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* OVERLAY */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 20;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    /* HERO */
    .hero {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      flex-direction: column;
      padding: 3rem 0;
      width: 100%;
    }

    .hero-logo {
      width: 90%;
      max-width: 900px;
      height: auto;
      filter: drop-shadow(0 10px 30px rgba(217,119,43,0.35));
    }

    /* VIDEO */
    .recent-video {
      width: 100%;
      padding: 5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .recent-video h2 {
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-size: 1.1rem;
    }

    .video-wrapper {
      width: min(900px, 95%);
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(217,119,43,0.4);
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      background: #000;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .page-content {
      flex: 1;
    }

    footer {
      margin-top: auto;
      padding: 1.5rem 0;
      background: rgba(23,29,22,0.9);
      border-top: 1px solid rgba(217,119,43,0.25);
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
  </style>
</head>
