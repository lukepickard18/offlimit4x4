<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ForgedX</title>
  <style>
    :root {
      --bg-dark: #0b0f14;
      --accent-blue: #3b82f6;
      --accent-blue-soft: #1e3a8a;
      --text-main: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: radial-gradient(1200px 600px at 50% -200px, var(--accent-blue-soft), var(--bg-dark));
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    /* NAVBAR */
    nav {
      width: 100%;
      position: sticky;
      top: 0;
      background: rgba(11, 15, 20, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      z-index: 10;
      display: flex;
      justify-content: center;
    }

    .nav-inner {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-around;
      padding: 1rem 0;
    }

    nav a {
      text-decoration: none;
      color: var(--text-main);
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--accent-blue);
    }

    /* HERO TITLE POP */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
      gap: 1rem;
      padding-top: 3rem;
      width: 100%;
    }

    .hero h1 {
      font-size: clamp(4rem, 10vw, 7rem);
      letter-spacing: 0.12em;
      color: var(--text-main);
      text-transform: uppercase;
      text-shadow: 
        0 0 5px var(--accent-blue),
        0 0 10px var(--accent-blue),
        0 0 20px var(--accent-blue),
        0 0 40px var(--accent-blue-soft),
        0 0 80px var(--accent-blue-soft);
      animation: glow 2s ease-in-out infinite alternate;
      width: 100%;
      text-align: center;
    }

    .hero h1 span {
      color: var(--accent-blue);
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px var(--accent-blue), 0 0 10px var(--accent-blue), 0 0 20px var(--accent-blue); }
      to { text-shadow: 0 0 10px var(--accent-blue), 0 0 20px var(--accent-blue), 0 0 40px var(--accent-blue-soft); }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="#">Videos</a>
      <a href="#">Team</a>
      <a href="#">Merch</a>
    </div>
  </nav>

  <section class="hero">
    <h1>FORGED<span>X</span></h1>
  </section>

</body>
</html>
