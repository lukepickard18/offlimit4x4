<head>

  <title>Videos — Off Limits 4x4</title>

  <style>
    :root {
      --bg-dark: #0f130e;
      --bg-panel: #171d16;
      --text-main: #f2f2ee;
      --text-muted: #b3b3a8;
      --accent-primary: #d9772b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        "Arial Narrow",
        "Bahnschrift",
        "Oswald",
        system-ui,
        sans-serif;
    }

    body {
      background:
        radial-gradient(1000px 500px at 50% -200px, rgba(217,119,43,0.18), transparent),
        var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* HAMBURGER */
    .menu-btn {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 30;
      width: 34px;
      height: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .menu-btn span {
      height: 3px;
      width: 100%;
      background: var(--text-main);
      border-radius: 2px;
    }

    /* SIDEBAR */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 280px;
      background: var(--bg-panel);
      border-right: 1px solid rgba(217,119,43,0.35);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 25;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4rem 0 1.5rem;
    }

    nav.open {
      transform: translateX(0);
    }

    .nav-inner {
      display: flex;
      flex-direction: column;
      gap: 2.2rem;
      padding-left: 2.5rem;
    }

    nav a {
      text-decoration: none;
      color: var(--text-main);
      font-size: 1rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      transition: color 0.2s ease, transform 0.15s ease;
    }

    nav a:hover {
      color: var(--accent-primary);
      transform: translateX(4px);
    }

    /* SOCIALS */
    .socials {
      border-top: 1px solid rgba(217,119,43,0.25);
      padding: 1.5rem 2.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }

    .socials span {
      color: var(--text-muted);
      font-size: 0.7rem;
      margin-bottom: 0.2rem;
    }

    .socials a {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.75rem;
      transition: color 0.2s ease;
    }

    .socials a:hover {
      color: var(--accent-primary);
    }

    /* OVERLAY */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 20;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    /* PAGE CONTENT */
    .container {
      max-width: 1100px;
      padding: 4rem 1.5rem;
      width: 100%;
      flex: 1;
      text-align: center;
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }

    h1 span {
      color: var(--accent-primary);
    }

    /* VIDEO GRID */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.4rem;
      max-width: 700px;
      margin: 0 auto;
    }

    .video-card {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0));
      border: 1px solid rgba(217,119,43,0.3);
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      color: inherit;
    }

    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 30px rgba(0,0,0,0.45);
    }

    .video-card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
    }

    .video-card h3 {
      font-size: 1rem;
      letter-spacing: 0.12em;
      padding: 0.9rem 0.8rem;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.4;
    }

    /* MOBILE */
    @media (max-width: 640px) {
      .video-grid {
        grid-template-columns: 1fr;
      }
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 2rem 0 1rem;
    }
  </style>
</head>
