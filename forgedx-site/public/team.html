<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Off Limits 4x4 - Team</title>

  <style>
    :root {
      --bg-dark: #0f130e;
      --bg-panel: #171d16;

      --text-main: #f2f2ee;
      --text-muted: #b3b3a8;

      --accent-primary: #d9772b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        "Arial Narrow",
        "Bahnschrift",
        "Oswald",
        system-ui,
        sans-serif;
    }

    body {
      background:
        radial-gradient(1000px 500px at 50% -200px, rgba(217,119,43,0.18), transparent),
        var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HAMBURGER */
    .menu-btn {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 30;
      width: 34px;
      height: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .menu-btn span {
      height: 3px;
      width: 100%;
      background: var(--text-main);
      border-radius: 2px;
    }

    /* SIDEBAR */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 280px;
      background: var(--bg-panel);
      border-right: 1px solid rgba(217,119,43,0.35);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 25;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4rem 0 1.5rem;
    }

    nav.open {
      transform: translateX(0);
    }

    .nav-inner {
      display: flex;
      flex-direction: column;
      gap: 2.2rem;
      padding-left: 2.5rem;
    }

    nav a {
      text-decoration: none;
      color: var(--text-main);
      font-size: 1rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      transition: color 0.2s ease, transform 0.15s ease;
    }

    nav a:hover {
      color: var(--accent-primary);
      transform: translateX(4px);
    }

    /* SOCIALS */
    .socials {
      border-top: 1px solid rgba(217,119,43,0.25);
      padding: 1.5rem 2.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }

    .socials span {
      color: var(--text-muted);
      font-size: 0.7rem;
      margin-bottom: 0.2rem;
    }

    .socials a {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.75rem;
      transition: color 0.2s ease;
    }

    .socials a:hover {
      color: var(--accent-primary);
    }

    /* OVERLAY */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 20;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    /* PAGE CONTENT */
    .page-content {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8rem 1.5rem;
      text-align: center;
    }

    .coming-soon {
      font-size: 2rem;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      border: 2px dashed rgba(217,119,43,0.5);
      padding: 4rem 2rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      background: rgba(23,29,22,0.5);
    }

    @media (max-width: 768px) {
      .page-content {
        padding: 6rem 1rem;
      }
      .coming-soon {
        font-size: 1.5rem;
        padding: 3rem 1.5rem;
      }
    }

  </style>
</head>

<body>
  <!-- HAMBURGER -->
  <div class="menu-btn" onclick="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="nav-inner">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="videos.html">Videos</a>
      <a href="team.html">Team</a>
      <a href="merch.html">Merch</a>
    </div>

    <div class="socials">
      <span>FOLLOW US</span>

      <a href="https://www.instagram.com/offlimits_4x4/" target="_blank">
        @offlimits4x4
      </a>
      <a href="https://www.tiktok.com/@off.limits.4x4" target="_blank">
        @offlimits4x4
      </a>
      <a href="https://www.youtube.com/channel/UCMJJryJ2M83iyxQ91pCxlVg" target="_blank">
        @offlimits4x4
      </a>
    </div>
  </nav>

  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <main class="page-content">
    <div class="coming-soon">Team Coming Soon</div>
  </main>

  <footer>
    © Off Limits 4x4 2026
  </footer>

  <script>
    function toggleMenu() {
      document.getElementById("sidebar").classList.toggle("open");
      document.getElementById("overlay").classList.toggle("show");
    }
  </script>
</body>
</html>
